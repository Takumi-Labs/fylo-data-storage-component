<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fylo Data Storage</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="(https://fonts.google.com/specimen/Raleway)" />
  </head>
  <body>
    <header class="storage-container">
      <div class="fylo-logo">
        <img src="images/logo.svg" alt="fylo logo" />
      </div>
      <div class="icons">
        <img
          src="images/icon-document.svg"
          alt="image of a document"
          class="icon-item"
        />
        <img
          src="images/icon-folder.svg"
          alt="image of a folder"
          class="icon-item"
        />
        <img
          src="images/icon-upload.svg"
          alt="image of an upload"
          class="icon-item"
        />
      </div>
    </header>
    <main class="storage-card">
      <div class="storage-info">
        <p class="info">
          You've used <span class="storage-info-value">815 GB</span> of your
          storage
        </p>
        <div class="progress-bar">
          <div class="progress"></div>
        </div>
        <div class="storage">
          <p>0 GB</p>
          <p>1000 GB</p>
        </div>
      </div>
      <div class="storage-left">
        <p><span class="value">185 </span>GB LEFT</p>
      </div>
    </main>
  </body>
</html>
