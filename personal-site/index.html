<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fylo Data Storage</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="(https://fonts.google.com/specimen/Raleway)" />
  </head>
  <body>
    <header>
      <img src="images/logo.svg" alt="fylo logo" />
      <div class="icons">
        <img src="images/icon-document.svg" alt="image of a document" />
        <img src="images/icon-folder.svg" alt="image of a folder" />
        <img src="images/icon-upload.svg" alt="image of an upload" />
      </div>
    </header>
    <main>
      <div>
        <p>You've used <span>815 GB</span> of your storage</p>
        <div class="storage">
          <p>0 GB</p>
          <p>1000 GB</p>
        </div>
      </div>
      <div class="storage-left">
        <p>185 <span>GB LEFT</span></p>
      </div>
    </main>
  </body>
</html>
